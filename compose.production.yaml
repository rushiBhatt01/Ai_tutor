name: ai-tutor

x-runtime: &runtime
  ENVIRONMENT: production
  API_USERNAME: ${API_USERNAME:?Set API_USERNAME in the private runtime env file}
  API_PASSWORD: ${API_PASSWORD:?Set API_PASSWORD in the private runtime env file}
  MONGO_URI: ${MONGO_URI:?Set app-user MONGO_URI with authSource=video_tutorials}
  CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:?Set the existing provider key}
  CEREBRAS_MODEL: ${CEREBRAS_MODEL:-gpt-oss-120b}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
  PEXELS_API_KEY: ${PEXELS_API_KEY:-}
  UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
  IMAGE_PROVIDERS: ${IMAGE_PROVIDERS:-pixabay,wikimedia_commons,unsplash}
  IMAGE_SEARCH_ENABLED: ${IMAGE_SEARCH_ENABLED:-true}
  IMAGE_CACHE_DIR: /data/model-cache/images
  HF_HOME: /data/model-cache/huggingface
  STATE_DIR: /data/state
  RUNS_DIR: /data/runs
  ARTIFACT_DIR: /data/artifacts
  ARTIFACT_BACKEND: ${ARTIFACT_BACKEND:-local}
  ARTIFACT_PREFIX: ai-tutor
  OCI_STORAGE_APPROVED: ${OCI_STORAGE_APPROVED:-false}
  OCI_STORAGE_NAMESPACE: ${OCI_STORAGE_NAMESPACE:-}
  OCI_STORAGE_BUCKET: ${OCI_STORAGE_BUCKET:-}
  JOB_QUEUE_ENABLED: "true"
  JOB_QUEUE_CAPACITY: ${JOB_QUEUE_CAPACITY:-4}
  JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-1800}
  JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-2}
  TEMP_MAX_MB: ${TEMP_MAX_MB:-4096}
  CPU_ONLY: "true"
  CUDA_VISIBLE_DEVICES: ""
  AVATAR_MODE: static
  VISUAL_RENDER_WORKERS: "1"
  MANIM_WORKER_MEMORY_MB: "3072"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

x-backend: &backend
  image: ai-tutor-backend:cpu
  build:
    context: .
    dockerfile: backend/Dockerfile.cpu
  platform: ${TARGET_PLATFORM:-linux/arm64}
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  tmpfs: [/tmp:size=256m,mode=1777]
  environment: *runtime
  volumes:
    - state:/data/state
    - runs:/data/runs
    - artifacts:/data/artifacts
    - model_cache:/data/model-cache
  networks: [egress, data]
  logging: &logs
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  api:
    <<: *backend
    cpus: 0.25
    mem_limit: 768m
    depends_on:
      mongo: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *backend
    command: [python, -m, cpu_worker]
    cpus: 1.3
    mem_limit: 7g
    stop_grace_period: 20s
    healthcheck:
      test: [CMD, python, -c, "import os,time; assert time.time()-os.stat('/data/state/worker.heartbeat').st_mtime < 30"]
      interval: 20s
      timeout: 5s
      retries: 3
    depends_on:
      mongo: {condition: service_healthy}

  mongo:
    image: mongo:7.0.43-jammy@sha256:f71f6d0913c945096cd058557cbadf4ad435007f378d84b3c4c636c928735e72
    platform: ${TARGET_PLATFORM:-linux/arm64}
    restart: unless-stopped
    command: [mongod, --bind_ip_all, --wiredTigerCacheSizeGB, "0.25"]
    cpus: 0.25
    mem_limit: 1g
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Set MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER:?Set MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./deployment/mongo-init.js:/docker-entrypoint-initdb.d/app.js:ro
    networks: [data]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging: *logs

  web:
    build:
      context: .
      dockerfile: deployment/Dockerfile.web
    platform: ${TARGET_PLATFORM:-linux/arm64}
    restart: unless-stopped
    cpus: 0.2
    mem_limit: 256m
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      API_USERNAME: ${API_USERNAME:?Set API_USERNAME}
      PROXY_PASSWORD_HASH: ${PROXY_PASSWORD_HASH:?Set bcrypt hash of API_PASSWORD}
    # Safe default: local SSH-tunnel preview only. Public bind is a separately
    # approved deployment step; API/Mongo/worker have no published host ports.
    ports:
      - "${PUBLIC_BIND_IP:-127.0.0.1}:80:80"
      - "${PUBLIC_BIND_IP:-127.0.0.1}:443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [egress]
    depends_on:
      api: {condition: service_healthy}
    logging: *logs

networks:
  egress: {}
  data: {internal: true}

volumes:
  state: {}
  runs: {}
  artifacts: {}
  model_cache: {}
  mongo_data: {}
  caddy_data: {}
  caddy_config: {}
